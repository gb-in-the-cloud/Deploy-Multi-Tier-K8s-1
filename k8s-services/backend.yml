apiVersion: apps/v1
kind: Deployment
metadata: 
  name: backend
  namespace: myapp
spec: 
  replicas: 2
  selector: 
    matchLabels:
      app: backend
  template: 
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: myapp/backend:1.0
          imagePullPolicy: IfNotPresent
          env: 
          - name: DATABASE_URL
            value: postgres://admin@postgres-service:5432/myapp
          - name: DATABASE_USER
            valueFrom:
              secretKeyRef:
                name: db-secret
                key: username
          - name: DATABASE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: db-secret
                key: password
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          ports:
          - containerPort: 80
          readinessProbe:
            tcpSocket: 
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
            
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
  - port: 80
    targetPort: 80
