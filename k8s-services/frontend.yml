apiVersion: apps/v1
kind: Deployment
metadata:
   name: frontend
spec: 
   replicas: 2
   selector: 
      matchLabels: 
         app: frontend
   template:
      metadata:
         labels:
            app: frontend
      spec:
         containers:
         - name: frontend
           image: nginx:alpine
           ports:
           - containerPort: 80
           resources:
             requests:
               cpu: "100m"
               memory: "128Mi"
             limits:
               cpu: "500m"
               memory: "256Mi"
           volumeMounts:
           - name: frontend-config
             mountPath: /etc/nginx/conf.d
             subpath: nginx.conf
         volumes: 
         - name: frontend-config
           configMap:
             name: nginx-config

---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  type: LoadBalancer
  selector: 
    app: frontend
  ports:
  - port: 80
    targetPort: 80